[workspace]
resolver = "3"
members = [
    "crates/vsl-diagnostics",
    "crates/vsl-syntax",
    "crates/vsl-mc",
    "crates/vsl-hir",
    "crates/vsl-pack",
    "crates/vsl-ir",
    "crates/vsl-spirv",
    "crates/vsl-glsl",
    "crates/vsl-driver",
    "crates/vsl-cli",
    "crates/vsl-lsp",
]

[workspace.package]
version = "2.0.0-alpha.2"
edition = "2024"
rust-version = "1.88"
authors = ["VulkanShaders Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/sysv86/VSL"

[workspace.dependencies]
# Internal workspace crates
vsl-diagnostics = { path = "crates/vsl-diagnostics" }
vsl-syntax = { path = "crates/vsl-syntax" }
vsl-mc = { path = "crates/vsl-mc" }
vsl-hir = { path = "crates/vsl-hir" }
vsl-pack = { path = "crates/vsl-pack" }
vsl-ir = { path = "crates/vsl-ir" }
vsl-spirv = { path = "crates/vsl-spirv" }
vsl-glsl = { path = "crates/vsl-glsl" }
vsl-driver = { path = "crates/vsl-driver" }

# Frontend, diagnostics, arenas, and deterministic collections
logos = "0.16.1"
ariadne = { version = "0.6.0", features = ["auto-color"] }
la-arena = "0.3.1"
smol_str = { version = "0.3.7", features = ["serde"] }
indexmap = { version = "2.14.2", features = ["serde"] }

# Hashing, SPIR-V binary constants, and serialization
blake3 = "1.8.2"
spirv = "0.4"
bitflags = { version = "2.10", features = ["serde"] }
thiserror = "2.0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
toml = "1.2"

# CLI, logging, and LSP server
clap = { version = "4.5.54", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tower-lsp-server = "0.23.0"
tokio = { version = "1.48", features = ["io-std", "macros", "rt-multi-thread", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
too_many_lines = "allow"
# Style-only pedantic lints that conflict with the established codebase style.
similar_names = "allow"
if_not_else = "allow"
match_same_arms = "allow"
single_match_else = "allow"
unnecessary_filter_map = "allow"
assert_is_empty = "allow"
struct_excessive_bools = "allow"
type_complexity = "allow"
case_sensitive_file_extension_comparisons = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
